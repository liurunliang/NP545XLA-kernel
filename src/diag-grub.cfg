# The build substitutes the bundle ID and embeds this menu in BOOTAA64.EFI.
set timeout=5
set default=0
set gfxpayload=keep
set debug=linux,fdt

function diag_stop {
    echo "GRUB STOP: ${diag_entry}: $1. Restart to return to the menu."
    # Returning to normal mode with a registered loader triggers an implicit boot.
    while test 1 = 1; do sleep 30; done
}

function diag_media {
    if search --no-floppy --file --set=root /boot/media-@BUNDLE@; then
        echo "GRUB ${diag_entry}: media $root"
    else
        diag_stop 'media search failed'
    fi
}

function diag_handoff {
    echo "GRUB ${diag_entry}: Linux accepted"
    if initrd /boot/initramfs.cpio.gz; then
        echo "GRUB ${diag_entry}: initrd registered"
    else
        diag_stop 'initrd failed'
    fi
    echo "GRUB ${diag_entry}: before EFI boot"
    boot
    diag_stop 'EFI boot returned'
}

function diag_dt {
    diag_media
    echo "GRUB ${diag_entry}: loading Samsung DT"
    if devicetree /boot/samsung.dtb; then
        echo "GRUB ${diag_entry}: DT accepted"
    else
        diag_stop 'devicetree failed'
    fi
    if linux /boot/Image acpi=off efi=novamap clk_ignore_unused console=ttyMSM0,115200 console=tty0 consoleblank=0 diag.mode=dt "$@"; then
        diag_handoff
    else
        diag_stop 'linux failed'
    fi
}

menuentry 'NP545XLA diagnostic - firmware ACPI' {
    set diag_entry=ACPI
    diag_media
    echo 'GRUB ACPI: loading Linux'
    if linux /boot/Image acpi=on efi=debug,novamap earlycon=efifb console=ttyAMA0,115200 console=tty0 consoleblank=0 diag.mode=acpi; then
        diag_handoff
    else
        diag_stop 'linux failed'
    fi
}

menuentry 'NP545XLA diagnostic - Samsung device tree' {
    set diag_entry=DT
    diag_dt
}

menuentry 'NP545XLA diagnostic - Samsung DT + native display' {
    set diag_entry=DT-native
    diag_dt pd_ignore_unused regulator_ignore_unused diag.display=native
}
