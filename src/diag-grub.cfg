# Embedded in BOOTAA64.EFI, including when booted through El Torito.
set timeout=5
set default=0
search --no-floppy --file --set=root /boot/media-@BUNDLE@
set gfxpayload=keep

menuentry 'NP545XLA diagnostic - firmware ACPI' {
    echo 'Loading Linux and RAM diagnostics (ACPI)...'
    if linux /boot/Image acpi=on efi=novamap console=ttyAMA0,115200 console=tty0 consoleblank=0 diag.mode=acpi; then
        if initrd /boot/initramfs.cpio.gz; then boot; fi
    fi
    echo 'ACPI boot failed in GRUB.'
    sleep 30
}

menuentry 'NP545XLA diagnostic - Samsung device tree' {
    echo 'Loading Linux and RAM diagnostics (Samsung DT)...'
    if devicetree /boot/samsung.dtb; then
        if linux /boot/Image acpi=off efi=novamap clk_ignore_unused console=ttyMSM0,115200 console=tty0 consoleblank=0 diag.mode=dt; then
            if initrd /boot/initramfs.cpio.gz; then boot; fi
        fi
    fi
    echo 'Samsung DT boot failed in GRUB.'
    sleep 30
}
