# GRUB's EFI image and this USB root are siblings on this specific hybrid GPT.
function lid_edge_prepare {
    # The standalone GRUB runs from a memdisk. Locate the installed checksum
    # on FAT, then check the UUID of its sibling rather than searching for an unrelated root.
    if ! search --no-floppy --file --set=edge_esp /boot/lid-edge-@IMAGE@.sum; then
        diag_stop 'Cannot find the trial checksum on the USB ESP'
    fi
    if ! regexp --set=1:edge_disk '^([^,()]+),gpt2$' "$edge_esp"; then
        diag_stop 'Trial checksum must be on USB partition 2'
    fi
    set edge_part="${edge_disk},gpt3"
    if ! probe --set=edge_uuid --fs-uuid "($edge_part)"; then
        diag_stop 'Cannot read the sibling USB root'
    fi
    if [ "$edge_uuid" != "@UUID@" ]; then diag_stop 'USB root UUID mismatch'; fi
    set root=$edge_part
    if ! hashsum --hash sha256 --check "($edge_esp)/boot/lid-edge-@IMAGE@.sum"; then
        diag_stop 'Trial Image checksum failed'
    fi
    echo "GRUB ${diag_entry}: verified Image on $root"
    set root=$edge_esp
}

menuentry 'Debian 13 - Lid edge kernel (Samsung)' --id lid-edge {
    set diag_entry=Debian-lid-edge
    lid_edge_prepare
    if devicetree /boot/lid-@LID@.dtb; then
        lid_edge_boot @SAMSUNG_ARGS@ np545.lid_edge=1
    fi
    diag_stop 'Verified Samsung lid DT unavailable'
}

if [ "$diag_product" = NP545XLA-LID-EDGE-QEMU ]; then
    menuentry 'Lid edge kernel + USB root (QEMU ACPI)' --id lid-edge-qemu {
        set diag_entry=Debian-lid-edge-QEMU
        lid_edge_prepare
        lid_edge_boot acpi=on efi=novamap console=tty0 console=ttyAMA0,115200 diag.mode=acpi np545.lid_edge=1
    }
    set default=lid-edge-qemu
fi
