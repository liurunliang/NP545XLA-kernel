# Embedded only in loaders built with the trial firmware overlay.
function adreno_boot {
    if linux /boot/Image rdinit=/debian-init-adreno firmware_class.path=/var/lib/np545xla-adreno/firmware systemd.gpt_auto=0 consoleblank=0 "$@"; then
        echo "GRUB ${diag_entry}: Linux accepted"
    else
        diag_stop 'Adreno trial kernel failed'
    fi
    if initrd /boot/debian-initramfs.cpio.gz /boot/adreno-@OVERLAY_SHA256@.cpio.gz; then
        echo "GRUB ${diag_entry}: base and Adreno initramfs registered"
    else
        diag_stop 'Adreno trial initramfs failed'
    fi
    boot
    diag_stop 'EFI boot returned'
}
menuentry 'Debian 13 - Adreno unified DRM trial (Samsung)' --id adreno-unified {
    desktop_boot /boot/daily-@BUNDLE@.dtb unified
}
if [ "$diag_product" = NP545XLA-ADRENO-QEMU ]; then
    menuentry 'Adreno initramfs + USB root (QEMU ACPI)' --id adreno-qemu {
        set diag_entry=Adreno-QEMU
        if search --no-floppy --file --set=root /boot/adreno-@OVERLAY_SHA256@.cpio.gz; then
            adreno_boot acpi=on efi=novamap console=tty0 console=ttyAMA0,115200 diag.mode=acpi
        fi
        diag_stop 'Adreno trial overlay unavailable'
    }
    set default=adreno-qemu
fi
