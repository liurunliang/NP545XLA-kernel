# Appended to the unchanged diagnostic menu by build-debian-usb.sh.
function debian_boot {
    if linux /boot/Image rdinit=/debian-init systemd.gpt_auto=0 consoleblank=0 "$@"; then
        echo "GRUB ${diag_entry}: Linux accepted"
    else
        diag_stop 'Debian kernel failed'
    fi
    if initrd /boot/debian-initramfs.cpio.gz; then
        echo "GRUB ${diag_entry}: initrd registered"
    else
        diag_stop 'Debian initramfs failed'
    fi
    echo "GRUB ${diag_entry}: before EFI boot"
    boot
    diag_stop 'EFI boot returned'
}

menuentry 'Debian 13 ARM64 - Samsung DT + native display' --id debian {
    set diag_entry=Debian
    diag_media
    if devicetree /boot/debian-samsung.dtb; then
        echo "GRUB ${diag_entry}: DT accepted"
    else
        diag_stop 'Debian Samsung DT failed'
    fi
    debian_boot acpi=off efi=novamap clk_ignore_unused pd_ignore_unused regulator_ignore_unused console=ttyMSM0,115200 console=tty0 loglevel=3 diag.mode=dt diag.display=native
}

set default=debian
if smbios --type 1 --get-string 5 --set=diag_product; then
    if [ "$diag_product" = NP545XLA-DEBIAN-QEMU ]; then
        menuentry 'Debian 13 ARM64 (QEMU ACPI test)' --id debian-qemu {
            set diag_entry=Debian-QEMU
            diag_media
            debian_boot acpi=on efi=novamap console=tty0 console=ttyAMA0,115200 diag.mode=acpi
        }
        set default=debian-qemu
    fi
    if [ "$diag_product" = NP545XLA-DIAG-QEMU ]; then set default=0; fi
fi
